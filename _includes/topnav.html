<nav class="topnav" aria-label="Site navigation">
  <div class="topnav-inner">
    <a class="brand" href="{{ '/' | relative_url }}">Chang Meng</a>
    {%- for item in site.data.navigation %}
    <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
    {%- endfor %}
    <button id="theme-toggle" aria-label="Toggle light/dark theme" title="Toggle theme">🌙</button>
  </div>
</nav>
